# air configuration for live reload
# https://github.com/air-verse/air

[build]
  entrypoint     = "tmp/main"
  cmd            = "go build -o tmp/main ./cmd/server/"
  bin            = "tmp/main"
  include_ext    = ["go", "templ", "sql", "env", "css"]
  exclude_dir    = ["tmp", "bin", "example", "db/queries", "db/migrations"]
  exclude_regex  = ["_templ\\.go$"]
  delay          = 500
  kill_delay     = "1s"
  rerun          = false
  log            = "air.log"

[log]
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  clean_on_exit = true
