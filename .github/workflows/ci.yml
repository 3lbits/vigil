name: CI

# Pull request and push checks for Vigil, plus the release build.
#
#   Lint     – go vet and golangci-lint (formatting is gated here too).
#   Test     – the test suite, run with the race detector.
#   Security – dependency, static-analysis, and full-history secret scans.
#              Findings are published to the repository's Security tab.
#   Build    – builds and pushes the image. Runs only after Lint, Test, and
#              Security pass. On a push to main it publishes a rolling dev
#              image (:edge + :sha-...), unsigned. On a published GitHub
#              release it publishes the versioned, signed, attested image
#              (:1.2.3, :1.2, :latest). Never runs on a pull request.
#
# Releases are cut as GitHub Releases (not raw tag pushes), which avoids the
# "more than three tags pushed at once are silently ignored" trigger limit and
# gives a deliberate human checkpoint. See the README/RELEASING notes.
#
# Pull requests from forks run the three check jobs only. They need no secrets
# and run with a read-only token, so they are safe for untrusted contributions;
# Build is skipped on pull requests, so a fork can never reach the registry or
# signing identity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. ghcr.io/3lbits/vigil
  SEMGREP_VERSION: "1.166.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5
        with:
          install_args: >-
            go
            bun
            go:github.com/a-h/templ/cmd/templ
            golangci-lint
      - name: Generate templ # generated code must exist for the linter to typecheck
        run: templ generate ./...
      - name: Stub Tailwind output # CSS isn't needed to compile Go
        run: touch cmd/server/public/css/output.css
      - name: Vendor JS assets
        run: make js-vendor
      - name: go vet
        run: go vet ./...
      # golangci-lint also enforces formatting (gofmt + goimports) via the
      # formatters block in .golangci.yml; generated code is excluded there.
      - name: golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5
        with:
          install_args: >-
            go
            bun
            go:github.com/a-h/templ/cmd/templ
      - name: Generate templ
        run: templ generate ./...
      - name: Stub Tailwind output
        run: touch cmd/server/public/css/output.css
      - name: Vendor JS assets
        run: make js-vendor
      - name: Tests (race)
        run: go test -race -count=1 -timeout 120s ./...

  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # publish SARIF to the Security tab
      actions: read # required by upload-sarif on private repositories
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history is required by the gitleaks history scan
          persist-credentials: false # keep the checkout token out of git config
      - uses: jdx/mise-action@v4.2.5
        with:
          install_args: >-
            go
            bun
            go:github.com/a-h/templ/cmd/templ
            go:golang.org/x/vuln/cmd/govulncheck
      - name: Generate templ
        run: templ generate ./...
      - name: Stub Tailwind output
        run: touch cmd/server/public/css/output.css
      - name: Vendor JS assets
        run: make js-vendor

      # Tracked at the latest release so scans pick up the newest advisories.
      - name: govulncheck
        run: govulncheck ./...

      # Static analysis plus working-tree secret detection. --error fails the
      # job on any finding; the SARIF report is written first, so the upload
      # step still runs (if: always) and findings reach the Security tab.
      - name: Semgrep
        run: |
          python3 -m pip install --quiet --user "semgrep==${SEMGREP_VERSION}"
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --error --sarif --output semgrep.sarif \
            --config p/golang \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/supply-chain
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Full git-history secret scan with the MIT-licensed gitleaks binary.
      # The scan must not abort the job before its report is uploaded, so the
      # exit code is captured rather than allowed to fail the step (set +e,
      # exit 0). --exit-code 2 marks "secrets found" so the gate step below can
      # distinguish a finding from a scan error. Pinned for reproducible gating;
      # bump deliberately and re-check the `git` subcommand flags on upgrade.
      - name: Gitleaks (secret scan, full history)
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.21.2 git \
            --no-banner --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif \
            --exit-code 2 \
            /repo
          echo "GITLEAKS_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Upload Gitleaks SARIF
        if: ${{ hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Fail on gitleaks findings
        if: ${{ env.GITLEAKS_EXIT == '2' }}
        run: |
          echo "::error::gitleaks found secrets in git history"
          exit 1

  build:
    name: Build, push & sign
    needs: [lint, test, security]
    # Releases publish the versioned, signed image; main publishes a rolling
    # dev image. Never on a pull request.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless cosign signing via OIDC
      attestations: write # build-provenance and SBOM attestations
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed for `git describe`
      # On a release the ref is the tag (refs/tags/v1.2.3), so the baked-in
      # version is taken straight from the tag name -> "1.2.3". This is immune
      # to multiple tags landing on one commit (git describe is not). On main
      # the describe string gives a useful dev version, e.g. v1.2.3-5-gabc1234.
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi
      # No QEMU: the Go binary is cross-compiled and the Dockerfile builder stage
      # is pinned to $BUILDPLATFORM, so no target-arch code runs during the build.
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Release ref refs/tags/v1.2.3 -> :1.2.3, :1.2, :latest, :sha-...
      # Push to main                 -> :edge, :sha-...
      # latest=auto only fires on the semver patterns, so a main build can
      # never move :latest.
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          # Provenance and SBOM are attached as GitHub-verifiable attestations
          # below, so buildkit's inline provenance is disabled.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Release-only supply-chain ceremony ---------------------------------
      # Signed + attested artifacts are the ones people pin and consume, so the
      # cosign signature and the provenance/SBOM attestations are produced for
      # releases only. To sign every image too, delete the `if:` on these steps.
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        if: github.event_name == 'release'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Attest build provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM
        if: github.event_name == 'release'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # The signed registry attestation (attest-sbom, below) is the SBOM of
          # record. Don't also attach to the release — that needs contents:write.
          upload-release-assets: false
      - name: Attest SBOM
        if: github.event_name == 'release'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
