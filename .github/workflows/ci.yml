name: CI

# Continuous integration for Vigil.
#
#   verify  – the gate run on every push and pull request: lint, vulnerability
#             scan, static analysis, full-history secret scan, and tests. Code
#             scanning results are published to the repository's Security tab.
#   codeql  – GitHub code scanning, run in parallel with verify.
#   build   – runs only after verify succeeds, and only for main or version
#             tags: builds the image, pushes it to GHCR, signs it (keyless),
#             and attests build provenance and an SBOM.
#
# Pull requests from forks run verify and codeql only. Neither needs secrets or
# write access, so untrusted contributions are safe to run; build is skipped on
# pull requests entirely, so a fork can never reach the registry or signing
# identity.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Tags get their own concurrency group
# so a release build is never cancelled by a later push to a branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least-privilege default; individual jobs widen this only where needed.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Images are published to ghcr.io/<owner>/<repo>, e.g. ghcr.io/3lbits/vigil.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The quality gate. Mirrors the local `make pre-commit` suite, enforced
  # server-side so it cannot be skipped. It is the required status check for
  # merging into main.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # publish SARIF to the Security tab

    steps:
      # Audits the runner's outbound network calls; useful for spotting
      # unexpected egress from dependencies or actions.
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history is required by the gitleaks history scan
          persist-credentials: false # keep the checkout token out of git config

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ
        run: templ generate ./...

      # The CSS bundle is not needed to compile or test the Go code; a stub file
      # satisfies the embed without running the Tailwind build.
      - name: Stub Tailwind output
        run: touch cmd/server/public/css/output.css

      - name: go vet
        run: go vet ./...

      # golangci-lint v2 also enforces formatting (gofmt + goimports) via the
      # formatters block in .golangci.yml; generated code is excluded there.
      # The action major version is tied to the linter major version.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      # Tracked at the latest release so scans pick up the newest advisories;
      # the advisory database is fetched at run time.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static analysis plus working-tree secret detection. --error fails the
      # job on any finding; the SARIF report is written first, so the upload
      # step below still runs (via if: always) and findings appear in the
      # Security tab even when the gate is red.
      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --error --sarif --output semgrep.sarif \
            --config p/golang \
            --config p/secrets \
            --config p/gitleaks

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Scans the full git history for committed secrets. Uses the MIT-licensed
      # gitleaks binary; `git` is the history-scan subcommand. The scan fails
      # the job on any finding, and --redact keeps secret values out of the logs.
      - name: Gitleaks (secret scan, full history)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest git --no-banner --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif /repo

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Tests (race)
        run: go test -race -count=1 -timeout 120s ./...

  # GitHub code scanning. Runs alongside verify and reports to the Security tab.
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001
      - run: templ generate ./...
      # CodeQL's autobuild compiles the project, which needs the embedded CSS.
      - run: touch cmd/server/public/css/output.css
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

  # Builds and publishes the release image. Runs only on pushes to main or to a
  # version tag, after verify passes. It does not run on pull requests, so it
  # never executes for forked contributions.
  build:
    name: Build, push & sign
    needs: [verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless cosign signing via OIDC
      attestations: write # build-provenance and SBOM attestations
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags are needed for `git describe`

      # Version tags resolve to a clean semver (v1.2.3); branch builds resolve to
      # a describe string such as v1.2.3-5-gabc1234.
      - name: Compute version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      # No QEMU: the Go binary is cross-compiled (CGO_ENABLED=0, GOOS/GOARCH) and
      # the Dockerfile builder stage is pinned to $BUILDPLATFORM, so no target-arch
      # code is executed during the build. buildx assembles the multi-arch
      # manifest without emulation.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Version tags publish a semver image tag; pushes to main publish branch
      # and sha tags.
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          # Provenance and SBOM are attached as GitHub-verifiable attestations in
          # the steps below, so buildkit's inline provenance is disabled.
          provenance: false
          # Persist the expensive, architecture-independent layers between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true