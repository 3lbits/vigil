name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as
        you can — partial reports are still useful.

        **Security issue?** Please follow [SECURITY.md](https://github.com/3lbits/vigil-public/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Minimal steps. A code snippet or repo link is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vigil version
      placeholder: "v1.4.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, deployment (Docker / k8s / bare), Postgres version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
