[settings]
idiomatic_version_file_enable_tools = ["go"]

[tools]
bun = "1.3.14"
semgrep = "latest"

# codegen + assets (pin these — output can shift between versions)
sqlc        = "1.30"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1100"
"github:tailwindlabs/tailwindcss" = { version = "4.1.5", rename_exe = "tailwindcss" }

# dev loop
air = "latest"

# lint / vuln / dead code
golangci-lint = "2.15"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:golang.org/x/tools/cmd/deadcode" = "latest"

# load testing (replaces the "brew install k6" hint in your loadtest targets)
k6 = "latest"
