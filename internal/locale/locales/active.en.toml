# About page
[about_subtitle]
other = "About this Vigil instance"

[about_open_source_badge]
other = "Open source under Apache 2.0"

[about_intro]
other = "Vigil is an open-source GRC (governance, risk, compliance) toolbox for security and compliance teams. This instance runs the same codebase published at:"

[about_section_includes]
other = "What this instance includes"

[about_include_1]
other = "Compliance frameworks and requirement tracking, including CSV import and requirement/measure linking."

[about_include_2]
other = "Measure and activity management with owners, assignees, priorities, deadlines, and status transitions."

[about_include_3]
other = "Risk assessment and treatment workflow (including NS 5814-aligned flows), risk register views, and linked assets/measures/activities."

[about_include_4]
other = "Asset inventory and linkage to assessments and individual risks."

[about_include_5]
other = "Admin tooling for users, organisations, sessions, audit logs, exports, module settings, and risk settings."

[about_include_6]
other = "Authentication options for development stub auth, GitHub, Entra ID, and generic OIDC providers."

[about_issues_intro]
other = "For work in progress and planned changes, use the issue tracker:"

[about_section_approach]
other = "Technical approach"

[about_approach_1]
other = "Go + templ keeps rendering server-side and deploys as a single binary."

[about_approach_2]
other = "htmx + Alpine.js gives interactive behaviour without a heavy SPA."

[about_approach_3]
other = "PostgreSQL + sqlc + goose keeps data access SQL-first, type-safe, and migration-driven."

[about_approach_4]
other = "Tailwind CSS CLI compiles styles at build time, with no Node toolchain needed at runtime."

[about_approach_5]
other = "OPA/Rego keeps authorisation policy-based and centrally enforced."

[about_approach_closing]
other = "The stack is intentionally boring so a Vigil deployment can be run reliably by one person."

[about_section_security]
other = "Security"

[about_security_1_intro]
other = "Vulnerabilities are disclosed privately through GitHub private vulnerability reporting; see"

[about_security_2]
other = "Container images are distroless, run as non-root, and use digest-pinned base images with build provenance attestation in CI."

[about_security_3]
other = "Authorisation is policy-based through OPA/Rego; handlers do not implement role checks directly."

[about_security_4]
other = "The project follows OWASP Top 10 guidance and is regularly audited for security and architecture quality."

[about_section_contributing]
other = "Contributing"

[about_contributing_1_intro]
other = "Bug reports and pull requests are welcome. Contribution process and expectations are documented in"

[about_contributing_2_intro]
other = "AI coding agents (including Claude Code and Copilot CLI) are used in development; conventions for agent-assisted changes are documented in"

[about_section_posture]
other = "Project posture"

[about_posture_1_intro]
other = "Vigil is open source under Apache 2.0:"

[about_posture_1_outro]
other = "It is early software, used in production at ElBits, and interfaces may still change."

[about_posture_2]
other = "No commercial support, hosted offering, or maintenance commitments are provided."

