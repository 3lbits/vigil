other = "Go + templ holder rendering på serversiden og distribueres som én binærfil."

[about_approach_2]
other = "htmx + Alpine.js gir interaktivitet uten en tung SPA."

[about_approach_3]
other = "PostgreSQL + sqlc + goose holder datatilgang SQL-først, typesikker og migreringsdrevet."

[about_approach_4]
other = "Tailwind CSS CLI bygger stilene ved build-tid, uten Node-verktøykjede i runtime."

[about_approach_5]
other = "OPA/Rego holder autorisasjon policy-basert og sentralt håndhevet."

[about_approach_closing]
other = "Stakken er bevisst enkel, slik at en Vigil-instans kan driftes stabilt av én person."

[about_section_security]
other = "Sikkerhet"

[about_security_1_intro]
other = "Sårbarheter rapporteres privat via GitHub private vulnerability reporting; se"

