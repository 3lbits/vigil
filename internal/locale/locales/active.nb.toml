other = "Samsvarsrammeverk og kravsporing, inkludert CSV-import og kobling mellom krav og tiltak."

[about_include_2]
other = "Tiltaks- og aktivitetsstyring med eiere, ansvarlige, prioritet, frister og statusoverganger."

[about_include_3]
other = "Risikovurderings- og behandlingsflyt (inkludert NS 5814-tilpassede flyter), risikoregistervisninger og koblede aktiva/tiltak/aktiviteter."

[about_include_4]
other = "Aktivainventar og kobling til vurderinger og enkeltrisikoer."

[about_include_5]
other = "Adminverktøy for brukere, organisasjoner, sesjoner, revisjonslogg, eksport, modulinnstillinger og risikoinnstillinger."

[about_include_6]
other = "Autentiseringsalternativer for utviklingsstub, GitHub, Entra ID og generiske OIDC-leverandører."

[about_issues_intro]
other = "For arbeid som pågår og planlagte endringer, bruk issue-sporingen:"

[about_section_approach]
other = "Teknisk tilnærming"

