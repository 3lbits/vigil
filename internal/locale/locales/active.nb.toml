other = "Containerbilder er distroless, kjører som ikke-root, og bruker digest-pinnede basebilder med provenance-attestering i CI."

[about_security_3]
other = "Autorisasjon er policy-basert via OPA/Rego; handlere gjør ikke direkte rollekontroller."

[about_security_4]
other = "Prosjektet følger OWASP Top 10-veiledning og revideres jevnlig for sikkerhet og arkitekturkvalitet."

